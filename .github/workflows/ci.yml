name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # llvmpipe gives the Linux runner a real (software) Vulkan adapter, so
      # the GPU test runs there instead of skipping; the other runners have
      # no adapter and the test skips with a clear message.
      - name: Install a software Vulkan device (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  msrv:
    name: msrv (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      - name: Build at the declared MSRV
        run: cargo build --workspace --all-targets --locked

  package:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # dpkg-dev brings dpkg-shlibdeps, which resolves the .deb's `$auto`
      # dependencies, and dpkg-deb, which inspects the result below.
      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build the release binary
        run: cargo build --release --locked -p murmuration-gpu

      # The release workflow runs the same packaging from a tag. This job is
      # here so `[package.metadata.deb]` cannot rot between releases.
      - name: Build and inspect the .deb
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          cargo deb -p murmuration-gpu --no-build
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb | grep -q 'usr/bin/murmuration-gpu'
          # `$auto` needs the runner's own shared libraries to resolve into
          # real dependencies; an empty Depends means dpkg-shlibdeps did not run.
          dpkg-deb --field target/debian/*.deb Depends | grep -q libc6
