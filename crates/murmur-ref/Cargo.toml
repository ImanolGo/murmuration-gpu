[package]
name = "murmur-ref"
description = "The CPU reference model from murmuration, kept as the oracle for murmuration-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The model is reimplemented here (PLAN.md phase 1, maintainer's decision), so
# it needs no terminal crate and does not depend on `murmuration`. These are the
# same crates and versions the reference uses, which is what makes the oracle
# comparable: identical `glam` and `rand` versions give bit-identical arithmetic
# and random streams.
glam.workspace = true
rand.workspace = true
rand_chacha.workspace = true
